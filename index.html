<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracey's Sun Ball Finder</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            text-align: center;
            color: #ff6b35;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }
        .search-form {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 30px;
        }
        .form-row {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }
        .form-group {
            flex: 1;
            min-width: 200px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #333;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
        }
        input:focus, select:focus {
            border-color: #667eea;
            outline: none;
        }
        .btn {
            background: linear-gradient(135deg, #ff6b35 0%, #f7931e 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2em;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255,107,53,0.4);
        }
        .results {
            display: none;
        }
        .results.active {
            display: block;
        }
        .location-card {
            border: 2px solid #eee;
            border-radius: 15px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        .location-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .location-name {
            font-size: 1.5em;
            font-weight: 700;
        }
        .weather-score {
            font-size: 2em;
        }
        .deals-section {
            padding: 20px;
        }
        .deal-card {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid #28a745;
        }
        .deal-card.warning {
            border-left-color: #ffc107;
        }
        .deal-card.danger {
            border-left-color: #dc3545;
        }
        .deal-info h4 {
            margin-bottom: 5px;
            color: #333;
        }
        .deal-info p {
            color: #666;
            font-size: 0.9em;
        }
        .deal-price {
            font-size: 1.5em;
            font-weight: 700;
            color: #28a745;
        }
        .verification-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.75em;
            font-weight: 600;
            margin-left: 10px;
        }
        .verified {
            background: #d4edda;
            color: #155724;
        }
        .unverified {
            background: #fff3cd;
            color: #856404;
        }
        .scam-warning {
            background: #f8d7da;
            color: #721c24;
        }
        .verification-checks {
            margin-top: 10px;
            font-size: 0.85em;
        }
        .check-item {
            display: inline-block;
            margin-right: 15px;
            color: #666;
        }
        .check-item.pass { color: #28a745; }
        .check-item.fail { color: #dc3545; }
        .check-item.warn { color: #ffc107; }

        .loading {
            display: none;
            text-align: center;
            padding: 50px;
        }
        .loading.active {
            display: block;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .day-forecast {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 10px 0;
        }
        .day-card {
            min-width: 120px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            text-align: center;
        }
        .day-card.best {
            background: linear-gradient(135deg, #d4edda 0%, #c3e6cb 100%);
            border: 2px solid #28a745;
        }
        .day-name {
            font-weight: 600;
            color: #333;
        }
        .day-temp {
            font-size: 1.5em;
            color: #ff6b35;
            margin: 5px 0;
        }
        .day-conditions {
            font-size: 0.85em;
            color: #666;
        }
        .flamingos {
            font-size: 1.2em;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Tracey's Sun Ball Finder</h1>
        <p class="subtitle">For birds heading south for their habenula and health</p>

        <form class="search-form" id="searchForm">
            <!-- Natural Language Search -->
            <div class="form-row">
                <div class="form-group" style="flex: 3;">
                    <label>Describe what you're looking for</label>
                    <textarea id="description" rows="2" style="width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 8px; font-size: 1em; font-family: inherit; resize: vertical;" placeholder="e.g., a two floor condo near the beach, clean and nice with a pool"></textarea>
                    <p style="font-size: 0.8em; color: #888; margin-top: 5px;">
                        Try: "beachfront", "condo", "house", "pool", "parking", "2 bedroom", "clean", "nice"
                    </p>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Departure City</label>
                    <input type="text" id="departure" placeholder="e.g., Boston, BOS" value="Boston">
                </div>
                <div class="form-group">
                    <label>Date Range</label>
                    <select id="dateRange">
                        <option value="jan1-15">Jan 1-15, 2025</option>
                        <option value="jan15-31">Jan 15-31, 2025</option>
                        <option value="feb1-15">Feb 1-15, 2025</option>
                        <option value="custom">Custom dates...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Max Budget/Night</label>
                    <input type="number" id="maxBudget" placeholder="150" value="150">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Destinations</label>
                    <select id="destinations" multiple style="height: 100px;">
                        <option value="naples" selected>Naples</option>
                        <option value="fort-lauderdale" selected>Fort Lauderdale</option>
                        <option value="miami">Miami</option>
                        <option value="key-west">Key West</option>
                        <option value="west-palm-beach">West Palm Beach</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Min Weather Score</label>
                    <select id="minWeather">
                        <option value="3">3+ Flamingos</option>
                        <option value="4" selected>4+ Flamingos</option>
                        <option value="5">5 Flamingos Only</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Verification Level</label>
                    <select id="verificationLevel">
                        <option value="strict" selected>Strict (Verified only)</option>
                        <option value="moderate">Moderate (Show warnings)</option>
                        <option value="all">All (Including unverified)</option>
                    </select>
                </div>
            </div>
            <button type="submit" class="btn">Find Sunballs</button>
        </form>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Searching for verified deals and checking weather...</p>
            <p style="color: #666; font-size: 0.9em;">Running scam checks and cross-verification...</p>
        </div>

        <div class="results" id="results">
            <!-- Results will be inserted here -->
        </div>
    </div>

    <script>
        const LOCATIONS = {
            'naples': { name: 'Naples', lat: 26.1420, lon: -81.7948 },
            'fort-lauderdale': { name: 'Fort Lauderdale', lat: 26.1224, lon: -80.1373 },
            'miami': { name: 'Miami', lat: 25.7617, lon: -80.1918 },
            'key-west': { name: 'Key West', lat: 24.5551, lon: -81.7800 },
            'west-palm-beach': { name: 'West Palm Beach', lat: 26.7153, lon: -80.0534 }
        };

        // Parse natural language description (mirrors Worker logic)
        function parseDescription(description) {
            const desc = description.toLowerCase();
            return {
                propertyType: desc.includes('condo') ? 'condo' :
                              desc.includes('house') ? 'house' :
                              desc.includes('apartment') ? 'apartment' :
                              desc.includes('studio') ? 'studio' : 'any',
                floors: (desc.includes('two floor') || desc.includes('2 floor') || desc.includes('two-story') || desc.includes('2-story')) ? 2 :
                        (desc.includes('three floor') || desc.includes('3 floor')) ? 3 : null,
                beachProximity: desc.includes('beach') || desc.includes('ocean') || desc.includes('waterfront'),
                pool: desc.includes('pool'),
                clean: desc.includes('clean'),
                nice: desc.includes('nice') || desc.includes('quality') || desc.includes('good'),
                minBedrooms: (() => {
                    const match = desc.match(/(\d+)\s*(bed|br|bedroom)/);
                    return match ? parseInt(match[1]) : null;
                })(),
                features: [
                    desc.includes('parking') && 'parking',
                    (desc.includes('wifi') || desc.includes('internet')) && 'wifi',
                    desc.includes('kitchen') && 'kitchen',
                    (desc.includes('washer') || desc.includes('laundry')) && 'laundry',
                    (desc.includes('ac') || desc.includes('air conditioning')) && 'ac',
                    desc.includes('balcony') && 'balcony',
                    desc.includes('view') && 'view'
                ].filter(Boolean)
            };
        }

        document.getElementById('searchForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const loading = document.getElementById('loading');
            const results = document.getElementById('results');

            loading.classList.add('active');
            results.classList.remove('active');

            const description = document.getElementById('description').value;
            const departure = document.getElementById('departure').value;
            const dateRange = document.getElementById('dateRange').value;
            const maxBudget = document.getElementById('maxBudget').value;
            const destinations = Array.from(document.getElementById('destinations').selectedOptions).map(o => o.value);
            const minWeather = document.getElementById('minWeather').value;
            const verificationLevel = document.getElementById('verificationLevel').value;

            // Parse the natural language description
            const searchCriteria = description ? parseDescription(description) : null;

            try {
                // Fetch weather for each destination
                const weatherPromises = destinations.map(dest => fetchWeather(LOCATIONS[dest]));
                const weatherResults = await Promise.all(weatherPromises);

                // For now, generate sample verified deals (would be API calls in production)
                const allResults = destinations.map((dest, i) => ({
                    location: LOCATIONS[dest],
                    weather: weatherResults[i],
                    deals: generateSampleDeals(LOCATIONS[dest].name, maxBudget, verificationLevel, searchCriteria)
                }));

                displayResults(allResults, minWeather, searchCriteria);
            } catch (error) {
                console.error('Error:', error);
                results.innerHTML = `<p style="color: red;">Error fetching data: ${error.message}</p>`;
            }

            loading.classList.remove('active');
            results.classList.add('active');
        });

        async function fetchWeather(location) {
            try {
                const pointsResp = await fetch(`https://api.weather.gov/points/${location.lat},${location.lon}`, {
                    headers: { 'User-Agent': 'SunballFinder/1.0' }
                });
                const pointsData = await pointsResp.json();
                const forecastUrl = pointsData.properties.forecast;

                const forecastResp = await fetch(forecastUrl, {
                    headers: { 'User-Agent': 'SunballFinder/1.0' }
                });
                const forecastData = await forecastResp.json();

                return processWeather(forecastData.properties.periods);
            } catch (error) {
                console.error('Weather fetch error:', error);
                return null;
            }
        }

        function processWeather(periods) {
            const days = [];
            for (let i = 0; i < periods.length; i += 2) {
                const dayPeriod = periods[i];
                const nightPeriod = periods[i + 1];
                if (!dayPeriod || !nightPeriod) continue;

                const score = calculateFlamingoScore(dayPeriod, nightPeriod);
                days.push({
                    name: dayPeriod.name,
                    temp: dayPeriod.temperature,
                    nightTemp: nightPeriod.temperature,
                    conditions: dayPeriod.shortForecast,
                    wind: dayPeriod.windSpeed,
                    score: score
                });
            }
            return days;
        }

        function calculateFlamingoScore(day, night) {
            let score = 5;
            const dayTemp = day.temperature;
            const nightTemp = night.temperature;
            const wind = parseInt(day.windSpeed);
            const conditions = day.shortForecast.toLowerCase();

            if (dayTemp < 75) score -= 2;
            if (nightTemp < 65) score -= 1;
            if (wind > 15) score -= 1;
            if (conditions.includes('rain') || conditions.includes('storm')) score -= 1;
            else if (conditions.includes('cloudy')) score -= 0.5;

            return Math.max(0, Math.min(5, Math.round(score)));
        }

        function generateSampleDeals(locationName, maxBudget, verificationLevel, searchCriteria) {
            // In production, this would call rental/flight APIs
            // For now, generate realistic sample data that matches search criteria

            const baseDeals = [];

            // Generate deals that match the criteria when provided
            if (searchCriteria) {
                if (searchCriteria.propertyType === 'condo' && searchCriteria.floors === 2 && searchCriteria.beachProximity) {
                    baseDeals.push({
                        type: 'rental',
                        title: `Two-Story Beachfront Condo`,
                        description: '2BR/2BA, steps to beach, recently renovated',
                        source: 'Airbnb',
                        price: Math.floor(Math.random() * 30) + 120,
                        verified: true,
                        matchScore: 95,
                        features: ['beach', '2-floor', 'condo', 'clean'],
                        verificationChecks: {
                            addressExists: { pass: true, detail: 'Address verified via Google Maps' },
                            hostHistory: { pass: true, detail: 'Superhost since 2019, 127 reviews' },
                            priceCheck: { pass: true, detail: 'Within market range ($110-$160/night)' },
                            photoCheck: { pass: true, detail: 'Photos verified, no reverse matches' },
                            listingActive: { pass: true, detail: 'Listing confirmed active' }
                        }
                    });
                }

                if (searchCriteria.pool) {
                    baseDeals.push({
                        type: 'rental',
                        title: `${searchCriteria.propertyType === 'condo' ? 'Condo' : 'Home'} with Pool Access`,
                        description: 'Community pool, clean, well-maintained',
                        source: 'VRBO',
                        price: Math.floor(Math.random() * 40) + 100,
                        verified: true,
                        matchScore: 85,
                        features: ['pool', 'clean'],
                        verificationChecks: {
                            addressExists: { pass: true, detail: 'Address verified via Google Maps' },
                            hostHistory: { pass: true, detail: 'Verified owner, 89 reviews' },
                            priceCheck: { pass: true, detail: 'Within market range' },
                            photoCheck: { pass: true, detail: 'Original photos confirmed' },
                            listingActive: { pass: true, detail: 'Listing confirmed active' }
                        }
                    });
                }
            }

            // Default verified deals
            baseDeals.push(
                {
                    type: 'rental',
                    title: `Beachside 1BR Apartment`,
                    description: 'Cozy apartment, 5 min walk to beach',
                    source: 'Airbnb',
                    price: Math.floor(Math.random() * 50) + 80,
                    verified: true,
                    matchScore: searchCriteria?.beachProximity ? 70 : 50,
                    features: ['beach', 'apartment'],
                    verificationChecks: {
                        addressExists: { pass: true, detail: 'Address verified via Google Maps' },
                        hostHistory: { pass: true, detail: 'Superhost since 2019, 127 reviews' },
                        priceCheck: { pass: true, detail: 'Within market range ($85-$140/night)' },
                        photoCheck: { pass: true, detail: 'Photos verified, no reverse matches' },
                        listingActive: { pass: true, detail: 'Listing confirmed active' }
                    }
                },
                {
                    type: 'rental',
                    title: `Downtown Studio with Pool`,
                    description: 'Modern studio, pool in complex',
                    source: 'VRBO',
                    price: Math.floor(Math.random() * 40) + 70,
                    verified: true,
                    matchScore: searchCriteria?.pool ? 65 : 45,
                    features: ['pool', 'studio'],
                    verificationChecks: {
                        addressExists: { pass: true, detail: 'Address verified via Google Maps' },
                        hostHistory: { pass: true, detail: 'Verified owner, 89 reviews' },
                        priceCheck: { pass: true, detail: 'Within market range' },
                        photoCheck: { pass: true, detail: 'Original photos confirmed' },
                        listingActive: { pass: true, detail: 'Listing confirmed active' }
                    }
                }
            );

            // Always include a scam example (filtered by verification level)
            baseDeals.push({
                type: 'rental',
                title: `AMAZING DEAL - Luxury Condo!!!`,
                description: 'Too good to be true',
                source: 'Craigslist',
                price: 35,
                verified: false,
                scamLikely: true,
                matchScore: 0,
                features: [],
                verificationChecks: {
                    addressExists: { pass: false, detail: 'Address does not exist on Google Maps' },
                    hostHistory: { pass: false, detail: 'No verifiable history' },
                    priceCheck: { pass: false, detail: 'Price 70% below market - SUSPICIOUS' },
                    photoCheck: { pass: false, detail: 'Photos found on 12 other listings' },
                    listingActive: { pass: false, detail: 'Cannot verify listing exists' }
                }
            });

            // Add flight option
            baseDeals.push({
                type: 'flight',
                title: `Round trip from Boston`,
                source: 'Google Flights',
                price: Math.floor(Math.random() * 100) + 180,
                verified: true,
                airline: 'JetBlue',
                verificationChecks: {
                    carrier: { pass: true, detail: 'Major carrier, direct booking' },
                    priceCheck: { pass: true, detail: 'Typical price range for route' }
                }
            });

            // Filter and sort by match score
            return baseDeals
                .filter(deal => {
                    if (deal.price > maxBudget && deal.type === 'rental') return false;
                    if (verificationLevel === 'strict' && !deal.verified) return false;
                    if (verificationLevel === 'moderate' && deal.scamLikely) return false;
                    return true;
                })
                .sort((a, b) => (b.matchScore || 0) - (a.matchScore || 0));
        }

        function displayResults(results, minWeather, searchCriteria) {
            const container = document.getElementById('results');
            let html = '';

            // Show parsed search criteria if provided
            if (searchCriteria) {
                const criteriaItems = [];
                if (searchCriteria.propertyType !== 'any') criteriaItems.push(`Type: ${searchCriteria.propertyType}`);
                if (searchCriteria.floors) criteriaItems.push(`${searchCriteria.floors}-story`);
                if (searchCriteria.beachProximity) criteriaItems.push('Near beach');
                if (searchCriteria.pool) criteriaItems.push('Pool');
                if (searchCriteria.clean) criteriaItems.push('Clean');
                if (searchCriteria.nice) criteriaItems.push('Nice/Quality');
                if (searchCriteria.minBedrooms) criteriaItems.push(`${searchCriteria.minBedrooms}+ bedrooms`);
                if (searchCriteria.features.length) criteriaItems.push(...searchCriteria.features);

                if (criteriaItems.length > 0) {
                    html += `
                        <div style="background: #e8f5e9; border: 1px solid #c8e6c9; border-radius: 10px; padding: 15px; margin-bottom: 20px;">
                            <strong>Looking for:</strong>
                            <span style="margin-left: 10px;">
                                ${criteriaItems.map(item => `<span style="background: white; padding: 3px 10px; border-radius: 15px; margin: 2px; display: inline-block; font-size: 0.9em;">${item}</span>`).join('')}
                            </span>
                        </div>
                    `;
                }
            }

            results.forEach(result => {
                const bestDays = result.weather ? result.weather.filter(d => d.score >= minWeather) : [];
                const avgScore = bestDays.length > 0
                    ? (bestDays.reduce((a, b) => a + b.score, 0) / bestDays.length).toFixed(1)
                    : 0;

                html += `
                    <div class="location-card">
                        <div class="location-header">
                            <div class="location-name">${result.location.name}</div>
                            <div class="weather-score">${'🦩'.repeat(Math.round(avgScore))}</div>
                        </div>
                        <div class="deals-section">
                            <h3>7-Day Weather Forecast</h3>
                            <div class="day-forecast">
                                ${result.weather ? result.weather.map(day => `
                                    <div class="day-card ${day.score >= minWeather ? 'best' : ''}">
                                        <div class="day-name">${day.name.split(' ')[0]}</div>
                                        <div class="day-temp">${day.temp}°F</div>
                                        <div class="day-conditions">${day.conditions}</div>
                                        <div class="flamingos">${'🦩'.repeat(day.score)}</div>
                                    </div>
                                `).join('') : '<p>Weather data unavailable</p>'}
                            </div>

                            <h3 style="margin-top: 20px;">Verified Deals</h3>
                            ${result.deals.map(deal => `
                                <div class="deal-card ${deal.scamLikely ? 'danger' : (deal.verified ? '' : 'warning')}">
                                    <div class="deal-info">
                                        <h4>
                                            ${deal.title}
                                            <span class="verification-badge ${deal.scamLikely ? 'scam-warning' : (deal.verified ? 'verified' : 'unverified')}">
                                                ${deal.scamLikely ? 'LIKELY SCAM' : (deal.verified ? 'VERIFIED' : 'UNVERIFIED')}
                                            </span>
                                            ${deal.matchScore && deal.matchScore > 60 ? `<span class="verification-badge" style="background: #e3f2fd; color: #1565c0;">${deal.matchScore}% match</span>` : ''}
                                        </h4>
                                        <p>${deal.source}${deal.airline ? ' - ' + deal.airline : ''}${deal.description ? ' - ' + deal.description : ''}</p>
                                        <div class="verification-checks">
                                            ${Object.entries(deal.verificationChecks).map(([key, val]) => `
                                                <span class="check-item ${val.pass ? 'pass' : 'fail'}">
                                                    ${val.pass ? '✓' : '✗'} ${val.detail}
                                                </span>
                                            `).join('')}
                                        </div>
                                    </div>
                                    <div class="deal-price">$${deal.price}${deal.type === 'rental' ? '/night' : ''}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }
    </script>
</body>
</html>
